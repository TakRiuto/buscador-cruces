<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cruces Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    <style>
        /* Importamos Outfit como fallback visual de Google Sans */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        body {
            /* Prioriza Google Sans/Product Sans, si no, usa Outfit */
            font-family: 'Google Sans', 'Product Sans', 'Outfit', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #e2e8f0; /* slate-200 */
        }

        /* Scrollbar personalizado para tema oscuro */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; /* slate-800 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; /* slate-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; /* slate-500 */
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 antialiased">

    <div class="max-w-5xl mx-auto bg-slate-800 p-6 md:p-10 rounded-2xl shadow-2xl border border-slate-700/50">
        <h1 class="text-3xl font-bold mb-1 text-white tracking-tight">Validador Geográfico</h1>
        <p class="text-slate-400 text-sm mb-8">Búsqueda y cruce de datos inteligente</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-slate-700/30 p-6 rounded-xl border border-slate-600/50 backdrop-blur-sm transition-colors hover:bg-slate-700/40">
                <h2 class="font-semibold text-lg text-blue-400 mb-2 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Pegado Rápido
                </h2>
                <p class="text-sm text-slate-400 mb-4">Copia la fila (Urb, Ppal, Inicio-Fin) y pégala aquí:</p>
                <textarea id="boxRapida" rows="3" 
                    class="w-full p-4 bg-slate-900/80 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm text-slate-200 placeholder-slate-600 transition-all resize-none shadow-inner" 
                    placeholder="Ej: Los Dos Caminos   Av Sucre   Calle 1 - Calle 2" 
                    oninput="buscar('rapida')"></textarea>
                <div class="flex justify-end mt-3">
                    <button onclick="limpiarTodo()" class="text-sm text-slate-400 hover:text-rose-400 transition-colors font-medium">Limpiar campos</button>
                </div>
            </div>

            <div class="bg-slate-700/30 p-6 rounded-xl border border-slate-600/50 backdrop-blur-sm transition-colors hover:bg-slate-700/40">
                <h2 class="font-semibold text-lg text-slate-200 mb-2 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Búsqueda Manual
                </h2>
                <p class="text-sm text-slate-400 mb-4">Escribe en uno o varios campos:</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <div class="md:col-span-2">
                        <label class="block text-slate-400 text-xs font-semibold mb-1.5 uppercase tracking-wide">Urbanización</label>
                        <input type="text" id="boxUrb" class="w-full p-3 bg-slate-900/80 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-200 transition-all" oninput="buscar('manual')">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs font-semibold mb-1.5 uppercase tracking-wide">Calle Ppal</label>
                        <input type="text" id="boxPpal" class="w-full p-3 bg-slate-900/80 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-200 transition-all" oninput="buscar('manual')">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs font-semibold mb-1.5 uppercase tracking-wide">Cruces</label>
                        <input type="text" id="boxCruces" class="w-full p-3 bg-slate-900/80 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-200 transition-all" placeholder="Inicio - Fin" oninput="buscar('manual')">
                    </div>
                </div>
            </div>
        </div>

        <div id="contador" class="mt-8 font-medium text-slate-300 text-sm"></div>

        <div id="resultados" class="mt-4 space-y-3 max-h-[450px] overflow-y-auto pr-2"></div>
    </div>

    <footer class="max-w-5xl mx-auto mt-6 pb-4 text-center">
        <p class="text-xs text-slate-500 tracking-wide">Creado por <span class="text-slate-400 font-medium">Ing. Adrián León, Esp.</span></p>
    </footer>

    <script src="data.js"></script>

<script>
        // ==================================================
        // CONFIGURACIÓN
        // ==================================================
        const PALABRAS_VIA = /\b(AVENIDA|AV|CALLE|CLL|CARRERA|CRA|VEREDA|VD|VDA|PASAJE|PSJ|BLVD|BOULEVARD|AUTOPISTA|AUT|PROLONGACION|PROL|CALLEJON|TRANSVERSAL|TRV)\b\.?/g;
        // Nota: se eliminó la "C" sola de la lista original porque, al ser una sola letra,
        // puede recortar iniciales o texto legítimo que no signifique "Calle".

        const MAX_RESULTADOS = 200;
        const DEBOUNCE_MS = 250;

        const OPCIONES_FUZZY = {
            includeScore: true,
            threshold: 0.3,
            ignoreLocation: true,
            keys: [
                { name: 'CLEAN_COMBO', weight: 2.0 },
                { name: 'CLEAN_URB', weight: 1.0 },
                { name: 'CLEAN_PPAL', weight: 1.0 },
                { name: 'CLEAN_CRUCES', weight: 1.2 }
            ]
        };

        // ==================================================
        // NORMALIZACIÓN DE TEXTO
        // ==================================================
        function limpiarTexto(texto) {
            if (!texto) return '';
            let t = String(texto).toUpperCase();
            t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // quita tildes
            t = t.replace(PALABRAS_VIA, '');
            t = t.replace(/[-_,]/g, ' ');
            t = t.replace(/\s+/g, ' ').trim();
            return t;
        }

        // Firma de cruce insensible al orden: "A - B" y "B - A" generan el mismo valor,
        // evitando duplicados que antes se colaban por el orden de las columnas.
        function normalizarCruce(inicio, fin) {
            const a = limpiarTexto(inicio);
            const b = limpiarTexto(fin);
            return [a, b].sort().join(' ');
        }

        // Umbral mínimo de similitud (0 a 1) para considerar que dos textos son "la misma calle"
        // a pesar de variaciones leves (abreviaturas distintas, errores de tipeo, etc.)
        const UMBRAL_CALLE = 0.75;

        // Distancia de Levenshtein: número mínimo de ediciones para convertir "a" en "b".
        function distanciaLevenshtein(a, b) {
            const m = a.length, n = b.length;
            if (m === 0) return n;
            if (n === 0) return m;

            const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    const costo = a[i - 1] === b[j - 1] ? 0 : 1;
                    dp[i][j] = Math.min(
                        dp[i - 1][j] + 1,     // eliminación
                        dp[i][j - 1] + 1,     // inserción
                        dp[i - 1][j - 1] + costo // sustitución
                    );
                }
            }
            return dp[m][n];
        }

        // Similitud normalizada entre 0 (nada parecido) y 1 (idéntico).
        function similitud(a, b) {
            if (!a || !b) return 0;
            if (a === b) return 1;
            const maxLen = Math.max(a.length, b.length);
            if (maxLen === 0) return 1;
            return 1 - distanciaLevenshtein(a, b) / maxLen;
        }

        // Extrae "inicio" y "fin" de un texto crudo, separando por el ÚLTIMO guion
        // (asume el formato "...algo... - Inicio - Fin" o "Inicio - Fin").
        function extraerCruces(textoCrudo) {
            if (!textoCrudo) return { inicio: '', fin: '' };
            const match = textoCrudo.match(/^(.*)-(.*)$/);
            if (!match) return { inicio: '', fin: '' };
            return {
                inicio: limpiarTexto(match[1]),
                fin: limpiarTexto(match[2])
            };
        }

        // Evalúa si un item tiene las MISMAS calles que la búsqueda pero en orden invertido,
        // tolerando variaciones leves. Si ya coincide en el orden normal, no cuenta como "invertido".
        function evaluarCrucesInvertidos(item, crucesQuery) {
            const { inicio: inicioQuery, fin: finQuery } = crucesQuery;
            if (!inicioQuery || !finQuery) return null;

            const simNormalA = similitud(item.CLEAN_INICIO, inicioQuery);
            const simNormalB = similitud(item.CLEAN_FIN, finQuery);
            if (simNormalA >= UMBRAL_CALLE && simNormalB >= UMBRAL_CALLE) return null;

            const simInvA = similitud(item.CLEAN_INICIO, finQuery);
            const simInvB = similitud(item.CLEAN_FIN, inicioQuery);
            if (simInvA >= UMBRAL_CALLE && simInvB >= UMBRAL_CALLE) {
                const promedio = (simInvA + simInvB) / 2;
                // 95-99%: muy alto, pero distinguible de una coincidencia exacta (100%)
                const exactitud = Math.min(99, Math.round(95 + promedio * 4));
                return { exactitud };
            }

            return null;
        }

        // ==================================================
        // PREPARACIÓN DE DATOS (se ejecuta una sola vez al cargar)
        // ==================================================
        function prepararDatos(data) {
            const unicos = [];
            const firmasVistas = new Set();

            data.forEach(item => {
                const inicio = item.CALLE_INICIO || '';
                const fin = item.CALLE_FIN || '';

                item.CRUCES_UNIDOS = `${inicio} - ${fin}`;
                item.CLEAN_URB = limpiarTexto(item.URBANIZACION);
                item.CLEAN_PPAL = limpiarTexto(item.CALLE_PPAL);
                // Orden ORIGINAL (tal como está en los datos / como lo escribe el usuario).
                // Este es el campo que se usa para buscar y para detectar coincidencias exactas.
                item.CLEAN_CRUCES = limpiarTexto(item.CRUCES_UNIDOS);
                item.CLEAN_COMBO = `${item.CLEAN_URB} ${item.CLEAN_PPAL} ${item.CLEAN_CRUCES}`;
                // Calles individuales limpias, para poder comparar "misma calle en otra posición"
                item.CLEAN_INICIO = limpiarTexto(inicio);
                item.CLEAN_FIN = limpiarTexto(fin);

                // Firma SOLO para deduplicar: aquí sí ignoramos el orden de las calles,
                // para no dejar pasar "AV 11 - AV 10" y "AV 10 - AV 11" como si fueran distintos.
                const firmaDedup = `${item.CLEAN_URB} ${item.CLEAN_PPAL} ${normalizarCruce(inicio, fin)}`;

                if (!firmasVistas.has(firmaDedup)) {
                    firmasVistas.add(firmaDedup);
                    unicos.push(item);
                }
            });

            return unicos;
        }

        const datosUnicos = prepararDatos(miData);
        const fuse = new Fuse(datosUnicos, OPCIONES_FUZZY);

        // ==================================================
        // REFERENCIAS AL DOM (cacheadas una sola vez)
        // ==================================================
        const dom = {
            rapida: document.getElementById('boxRapida'),
            urb: document.getElementById('boxUrb'),
            ppal: document.getElementById('boxPpal'),
            cruces: document.getElementById('boxCruces'),
            resultados: document.getElementById('resultados'),
            contador: document.getElementById('contador')
        };

        // ==================================================
        // CONTROL DE BÚSQUEDA (debounce + despacho por modo)
        // ==================================================
        let temporizador = null;

        function buscar(origen) {
            clearTimeout(temporizador);
            temporizador = setTimeout(() => ejecutarBusqueda(origen), DEBOUNCE_MS);
        }

        function obtenerTextoBusqueda(origen) {
            if (origen === 'rapida') {
                const crudo = dom.rapida.value.replace(/\t/g, ' ');
                const texto = limpiarTexto(crudo);
                const crucesQuery = extraerCruces(crudo);

                dom.urb.value = '';
                dom.ppal.value = '';
                dom.cruces.value = '';
                return { texto, crucesQuery };
            }

            const texto = limpiarTexto(`${dom.urb.value} ${dom.ppal.value} ${dom.cruces.value}`);
            const crucesQuery = extraerCruces(dom.cruces.value);

            dom.rapida.value = '';
            return { texto, crucesQuery };
        }

        // Coincidencia DIRECTA por texto: 0 = igual exacta, 1 = contiene el texto en el mismo orden.
        // Devuelve null si no hay coincidencia directa (se evalúa después si es "cruce invertido" o aproximada).
        function clasificarCoincidencia(item, textoBusqueda) {
            if (item.CLEAN_COMBO === textoBusqueda) return 0;
            if (item.CLEAN_COMBO.includes(textoBusqueda)) return 1;
            return null;
        }

        // Desempate alfabético: Urbanización -> Calle Inicial -> Calle Final.
        // Se usa cuando dos resultados tienen el mismo nivel de coincidencia (ej. varios al 100%).
        function compararAlfabetico(itemA, itemB) {
            const campos = ['URBANIZACION', 'CALLE_INICIO', 'CALLE_FIN'];
            for (const campo of campos) {
                const valA = (itemA[campo] || '').toString();
                const valB = (itemB[campo] || '').toString();
                const cmp = valA.localeCompare(valB, 'es', { sensitivity: 'base' });
                if (cmp !== 0) return cmp;
            }
            return 0;
        }

        // Niveles de prioridad finales:
        // 0 = coincidencia exacta total
        // 1 = contiene el texto en el mismo orden
        // 2 = mismas calles en el cruce, pero en orden invertido (tolerante a variaciones leves)
        // 3 = aproximada (solo coincide por fuzzy matching)
        function ordenarPorPrioridad(resultados, textoBusqueda, crucesQuery) {
            return resultados
                .map(res => {
                    const directa = clasificarCoincidencia(res.item, textoBusqueda);
                    if (directa !== null) {
                        return { ...res, _prioridad: directa, _exactitudForzada: null };
                    }

                    const invertido = evaluarCrucesInvertidos(res.item, crucesQuery);
                    if (invertido) {
                        return { ...res, _prioridad: 2, _exactitudForzada: invertido.exactitud };
                    }

                    return { ...res, _prioridad: 3, _exactitudForzada: null };
                })
                .sort((a, b) => {
                    if (a._prioridad !== b._prioridad) return a._prioridad - b._prioridad;
                    if (a._prioridad === 2) return b._exactitudForzada - a._exactitudForzada; // mayor similitud primero
                    if (a.score !== b.score) return a.score - b.score; // menor score = más relevante
                    return compararAlfabetico(a.item, b.item); // empate -> orden alfabético
                });
        }

        function ejecutarBusqueda(origen) {
            const { texto: textoBusqueda, crucesQuery } = obtenerTextoBusqueda(origen);

            if (textoBusqueda === '') {
                dom.resultados.innerHTML = '';
                dom.contador.innerHTML = '';
                return;
            }

            let resultados = fuse.search(textoBusqueda);
            resultados = ordenarPorPrioridad(resultados, textoBusqueda, crucesQuery);

            if (resultados.length === 0) {
                dom.contador.innerHTML = '';
                dom.resultados.innerHTML = renderSinResultados();
                return;
            }

            const resultadosMostrar = resultados.slice(0, MAX_RESULTADOS);

            let mensaje = `Se encontraron <span class="text-white">${resultados.length}</span> coincidencias`;
            if (resultados.length > MAX_RESULTADOS) {
                mensaje += ` <span class="text-slate-500">(Mostrando las ${MAX_RESULTADOS} más relevantes)</span>`;
            }
            dom.contador.innerHTML = mensaje;
            dom.resultados.innerHTML = resultadosMostrar.map(renderResultado).join('');
        }

        function limpiarTodo() {
            dom.rapida.value = '';
            dom.urb.value = '';
            dom.ppal.value = '';
            dom.cruces.value = '';
            dom.resultados.innerHTML = '';
            dom.contador.innerHTML = '';
        }

        // ==================================================
        // RENDERIZADO (separado de la lógica de búsqueda)
        // ==================================================
        function escapeHTML(valor) {
            if (valor === undefined || valor === null || valor === '') return '-';
            return String(valor)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function badgeExactitud(exactitud) {
            if (exactitud > 90) {
                return `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide">Muy Alta (${exactitud}%)</span>`;
            }
            if (exactitud > 70) {
                return `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide">Parcial (${exactitud}%)</span>`;
            }
            return `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide">Baja (${exactitud}%)</span>`;
        }

        function badgeCruceInvertido() {
            return `<span class="bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide">Cruce invertido</span>`;
        }

        function renderResultado(res) {
            const item = res.item;
            const esCruceInvertido = res._prioridad === 2;
            const exactitud = esCruceInvertido
                ? res._exactitudForzada
                : Math.round((1 - res.score) * 100);

            return `
            <div class="p-5 rounded-xl bg-slate-700/40 border border-slate-600/50 hover:bg-slate-700/70 hover:border-slate-500/50 transition-all duration-200 shadow-sm group">
                <div class="mb-3 flex justify-between items-center gap-2">
                    ${badgeExactitud(exactitud)}
                    ${esCruceInvertido ? badgeCruceInvertido() : ''}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
                    <div>
                        <span class="block text-[11px] text-slate-500 uppercase tracking-widest font-semibold mb-1">Urbanización</span>
                        <span class="text-slate-200 group-hover:text-white transition-colors">${escapeHTML(item.URBANIZACION)}</span>
                    </div>
                    <div>
                        <span class="block text-[11px] text-slate-500 uppercase tracking-widest font-semibold mb-1">Calle Ppal</span>
                        <span class="text-slate-200 group-hover:text-white transition-colors">${escapeHTML(item.CALLE_PPAL)}</span>
                    </div>
                    <div>
                        <span class="block text-[11px] text-slate-500 uppercase tracking-widest font-semibold mb-1">Cruces</span>
                        <span class="text-blue-400 font-medium group-hover:text-blue-300 transition-colors">${escapeHTML(item.CALLE_INICIO)} <span class="text-slate-500 font-normal mx-1">a</span> ${escapeHTML(item.CALLE_FIN)}</span>
                    </div>
                </div>
            </div>`;
        }

        function renderSinResultados() {
            return `<div class="p-5 bg-rose-500/10 text-rose-400 rounded-xl border border-rose-500/20 shadow-sm flex items-center gap-3">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        No se encontró ninguna coincidencia en la base de datos.
                    </div>`;
        }
    </script>
</body>
</html>
