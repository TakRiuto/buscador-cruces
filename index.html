<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Geográfico - NOC</title>
    
    <!-- Fuente del Sistema NOC -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Lógica de búsqueda -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    
    <style>
        /* =========================================================
           SISTEMA DE DISEÑO NOC (Extraído de theme.css y componentes)
           ========================================================= */
        :root {
            --accent: #00f0ff;
            --accent-rgb: 0, 240, 255;
            --accent-text: var(--accent);
            --accent-dark: #00b8c4;
            --on-accent: #0a0f14;

            --bg-base: #0a0f14;
            --bg-surface: #0d1117;
            --bg-surface-hover: #161b22;
            --bg-border: #21262d;
            --bg-border-strong: #30363d;

            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #484f58;

            --status-success: #00ff66;
            --status-warning: #ffcc00;
            --status-alert: #ff9900;
            --status-error: #ff0055;
            --status-rca: #b100ff;
            --status-info: #58a6ff;

            --font-main: "IBM Plex Sans", sans-serif;
            --font-mono: "IBM Plex Mono", monospace;

            --font-size-tiny: 10px;
            --font-size-xs: 11px;
            --font-size-sm: 12px;
            --font-size-base: 13px;
            --font-size-md: 14px;
            
            --radius-base: 4px; /* Un toque suavizado tech */
            --transition-fast: 0.1s ease-out;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: var(--font-size-base);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbars Globales */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--bg-border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dark); }

        /* Topbar UI */
        .main-topbar {
            background: var(--bg-surface-hover);
            padding: 12px 20px;
            border-bottom: 3px solid #0a1a24;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .topbar-title {
            color: var(--accent-text);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* Contenedor Principal */
        .app-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* Tarjetas / Paneles */
        .cfg-card {
            background: var(--bg-surface);
            border: 1px solid var(--bg-border-strong);
            border-radius: var(--radius-base);
            display: flex;
            flex-direction: column;
        }
        .cfg-card-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--bg-border-strong);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cfg-card-title {
            font-size: var(--font-size-sm);
            color: var(--accent-text);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Formularios y Controles */
        .grid-forms {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid-forms { grid-template-columns: 1fr; }
        }
        
        .p-15 { padding: 15px; }
        .flex-col { display: flex; flex-direction: column; gap: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-full { grid-column: 1 / -1; }

        .input-label {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
            letter-spacing: 0.5px;
        }

        .filtro-input {
            width: 100%;
            background: var(--bg-surface-hover);
            border: 1px solid var(--bg-border-strong);
            color: var(--text-primary);
            padding: 8px 10px;
            border-radius: var(--radius-base);
            font-family: var(--font-main);
            font-size: var(--font-size-sm);
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .filtro-input:focus {
            border-color: var(--accent-text);
            box-shadow: 0 0 0 1px var(--accent-text);
        }
        textarea.filtro-input {
            resize: none;
            height: 60px;
        }

        /* Botones NOC */
        .btn-accion {
            background: var(--bg-surface-hover);
            color: var(--accent-text);
            border: 1px solid var(--bg-border-strong);
            padding: 6px 12px;
            border-radius: var(--radius-base);
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: var(--font-size-xs);
            text-transform: uppercase;
            transition: all var(--transition-fast);
            align-self: flex-end;
        }
        .btn-accion:hover {
            border-color: var(--accent-text);
            background: rgba(0, 240, 255, 0.1);
        }

        /* Tabla Estilo NOC (Identificación / Viewers) */
        .v-table-wrapper {
            flex: 1;
            overflow: auto;
            border-top: 1px solid var(--bg-border-strong);
        }
        .v-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: var(--font-size-xs);
            text-align: left;
        }
        .v-table th {
            padding: 8px 12px;
            background: #05080a;
            color: var(--text-secondary);
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 1px solid var(--bg-border-strong);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .v-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--bg-border);
            background: rgba(0,0,0,0.15);
            transition: background var(--transition-fast);
        }
        .v-table tbody tr:hover td {
            background: var(--bg-surface-hover);
        }
        
        .val-mono {
            font-family: var(--font-mono);
            color: var(--text-primary);
        }
        .val-accent { color: var(--accent-text); font-weight: 600; }

        /* Badges de Estado */
        .badge {
            font-size: var(--font-size-tiny);
            font-weight: 700;
            padding: 2px 6px;
            border-radius: var(--radius-base);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .badge-success { background: rgba(0, 255, 102, 0.1); border: 1px solid var(--status-success); color: var(--status-success); }
        .badge-warning { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--status-warning); color: var(--status-warning); }
        .badge-error { background: rgba(255, 0, 85, 0.1); border: 1px solid var(--status-error); color: var(--status-error); }
        .badge-rca { background: rgba(177, 0, 255, 0.1); border: 1px solid var(--status-rca); color: var(--status-rca); }

        /* Alertas del Sistema */
        .sys-alert {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--status-error);
            color: var(--status-error);
            font-size: var(--font-size-sm);
            border-radius: var(--radius-base);
            margin: 20px;
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-style: italic;
            font-size: var(--font-size-sm);
        }

        /* Resaltado visual para cruces */
        .cruce-highlight {
            color: var(--status-info);
            font-weight: bold;
        }
        .cruce-connector {
            color: var(--text-muted);
            margin: 0 4px;
            font-size: var(--font-size-tiny);
        }
    </style>
</head>
<body>

    <!-- TOPBAR NOC -->
    <div class="main-topbar">
        <div class="topbar-title flex items-center gap-2">
            <svg style="width:16px; height:16px; display:inline-block; margin-right:6px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            VGI // VALIDADOR GEOGRÁFICO INTELIGENTE
        </div>
        <div style="font-size: var(--font-size-xs); color: var(--text-secondary);">
            SISTEMA <span style="color: var(--status-success); font-weight: bold;">EN LÍNEA</span>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="app-wrapper">
        
        <!-- PANELES DE CONTROL -->
        <div class="grid-forms">
            
            <!-- PANEL RÁPIDO -->
            <div class="cfg-card">
                <div class="cfg-card-header">
                    <svg style="width:14px; height:14px; color:var(--accent);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    <span class="cfg-card-title">Consola de Pegado Rápido</span>
                </div>
                <div class="p-15 flex-col">
                    <div>
                        <label for="boxRapida" class="input-label">Fila Cruda (Mcpo, Urb, Ppal, Cruces)</label>
                        <textarea id="boxRapida" class="filtro-input" placeholder="Ej: Girardot   11 de Abril   Pasaje El Valle   Vereda Del Valle - Calle 11 de Abril" oninput="buscar('rapida')"></textarea>
                    </div>
                    <button onclick="limpiarTodo()" class="btn-accion">Limpiar Filtros</button>
                </div>
            </div>

            <!-- PANEL MANUAL -->
            <div class="cfg-card">
                <div class="cfg-card-header">
                    <svg style="width:14px; height:14px; color:var(--text-secondary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span class="cfg-card-title" style="color: var(--text-secondary);">Búsqueda Estructurada</span>
                </div>
                <div class="p-15 grid-2">
                    <div>
                        <label for="boxMcpo" class="input-label">Municipio</label>
                        <input type="text" id="boxMcpo" class="filtro-input" oninput="buscar('manual')">
                    </div>
                    <div>
                        <label for="boxUrb" class="input-label">Urbanización</label>
                        <input type="text" id="boxUrb" class="filtro-input" oninput="buscar('manual')">
                    </div>
                    <div class="grid-full">
                        <label for="boxPpal" class="input-label">Calle Principal</label>
                        <input type="text" id="boxPpal" class="filtro-input" oninput="buscar('manual')">
                    </div>
                    <div>
                        <label for="boxInicio" class="input-label">Calle Inicio</label>
                        <input type="text" id="boxInicio" class="filtro-input" oninput="buscar('manual')">
                    </div>
                    <div>
                        <label for="boxFin" class="input-label">Calle Fin</label>
                        <input type="text" id="boxFin" class="filtro-input" oninput="buscar('manual')">
                    </div>
                </div>
            </div>

        </div>

        <!-- RESULTADOS (GRID NOC) -->
        <div class="cfg-card" style="flex: 1; min-height: 0;">
            <div class="cfg-card-header" style="justify-content: space-between;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <svg style="width:14px; height:14px; color:var(--text-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    <span class="cfg-card-title" style="color: var(--text-primary);">Base de Datos Geográfica</span>
                </div>
                <span id="contador" style="font-size: var(--font-size-xs); color: var(--text-secondary); font-family: var(--font-mono);"></span>
            </div>
            
            <div class="v-table-wrapper">
                <table class="v-table">
                    <thead>
                        <tr>
                            <th style="width: 120px;">Match</th>
                            <th style="width: 15%;">Municipio</th>
                            <th style="width: 25%;">Urbanización</th>
                            <th style="width: 25%;">Principal</th>
                            <th>Cruces Intersección</th>
                        </tr>
                    </thead>
                    <tbody id="resultados">
                        <tr>
                            <td colspan="5">
                                <div class="empty-state">Ingrese parámetros de búsqueda para consultar la base de datos...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Archivo de Datos (Asumimos que define 'miData') -->
    <script src="data.js"></script>

    <script>
        // ==================================================
        // CONFIGURACIÓN Y LÓGICA (Mejorada)
        // ==================================================
        const PALABRAS_VIA = /\b(AVENIDA|AV|CALLE|CLL|CARRERA|CRA|VEREDA|VD|VDA|PASAJE|PSJ|BLVD|BOULEVARD|AUTOPISTA|AUT|PROLONGACION|PROL|CALLEJON|TRANSVERSAL|TRV)\b\.?/g;
        
        const MAX_RESULTADOS = 200;
        const DEBOUNCE_MS = 250;
        const UMBRAL_CALLE = 0.75;

        const OPCIONES_FUZZY = {
            includeScore: true,
            threshold: 0.3,
            ignoreLocation: true,
            keys: [
                { name: 'CLEAN_COMBO', weight: 2.0 },
                { name: 'CLEAN_MCPO', weight: 1.0 },
                { name: 'CLEAN_URB', weight: 1.0 },
                { name: 'CLEAN_PPAL', weight: 1.0 },
                { name: 'CLEAN_CRUCES', weight: 1.2 }
            ]
        };

        const dom = {
            rapida: document.getElementById('boxRapida'),
            mcpo: document.getElementById('boxMcpo'),
            urb: document.getElementById('boxUrb'),
            ppal: document.getElementById('boxPpal'),
            inicio: document.getElementById('boxInicio'),
            fin: document.getElementById('boxFin'),
            resultados: document.getElementById('resultados'),
            contador: document.getElementById('contador')
        };

        let fuse = null;
        let datosUnicos = [];

        // Inicialización Segura
        function inicializarApp() {
            if (typeof miData === 'undefined') {
                dom.resultados.innerHTML = `
                    <tr><td colspan="5">
                        <div class="sys-alert">
                            <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Error crítico: No se ha podido cargar el archivo de datos (data.js) o la variable 'miData' no existe.
                        </div>
                    </td></tr>`;
                console.error("VGI Fatal Error: Variable 'miData' not found.");
                return;
            }
            datosUnicos = prepararDatos(miData);
            fuse = new Fuse(datosUnicos, OPCIONES_FUZZY);
            dom.contador.innerHTML = `DB LISTA [ ${datosUnicos.length} ROWS ]`;
        }

        // ==================================================
        // NORMALIZACIÓN
        // ==================================================
        function limpiarTexto(texto) {
            if (!texto) return '';
            let t = String(texto).toUpperCase();
            t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); 
            t = t.replace(PALABRAS_VIA, '');
            t = t.replace(/[-_,]/g, ' ');
            t = t.replace(/\s+/g, ' ').trim();
            return t;
        }

        function normalizarCruce(inicio, fin) {
            const a = limpiarTexto(inicio);
            const b = limpiarTexto(fin);
            return [a, b].sort().join(' ');
        }

        function extraerCruces(textoCrudo) {
            if (!textoCrudo) return { inicio: '', fin: '' };
            // FIX: Extraer correctamente separando por el último guion y tab/doble espacio
            const partes = textoCrudo.split('-');
            if (partes.length < 2) return { inicio: '', fin: '' };
            
            const fin = partes.pop(); // Último elemento
            const resto = partes.join('-'); // Restauramos si había guiones previos
            const inicioRaw = resto.split(/\s{2,}|\t/).pop(); // Última columna antes del guion
            
            return {
                inicio: limpiarTexto(inicioRaw || resto),
                fin: limpiarTexto(fin)
            };
        }

        function distanciaLevenshtein(a, b) {
            const m = a.length, n = b.length;
            if (m === 0) return n;
            if (n === 0) return m;

            const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    const costo = a[i - 1] === b[j - 1] ? 0 : 1;
                    dp[i][j] = Math.min(
                        dp[i - 1][j] + 1,
                        dp[i][j - 1] + 1,
                        dp[i - 1][j - 1] + costo
                    );
                }
            }
            return dp[m][n];
        }

        function similitud(a, b) {
            if (!a || !b) return 0;
            if (a === b) return 1;
            const maxLen = Math.max(a.length, b.length);
            if (maxLen === 0) return 1;
            return 1 - distanciaLevenshtein(a, b) / maxLen;
        }

        function evaluarCrucesInvertidos(item, crucesQuery) {
            const { inicio: inicioQuery, fin: finQuery } = crucesQuery;
            if (!inicioQuery || !finQuery) return null;

            const simNormalA = similitud(item.CLEAN_INICIO, inicioQuery);
            const simNormalB = similitud(item.CLEAN_FIN, finQuery);
            if (simNormalA >= UMBRAL_CALLE && simNormalB >= UMBRAL_CALLE) return null;

            const simInvA = similitud(item.CLEAN_INICIO, finQuery);
            const simInvB = similitud(item.CLEAN_FIN, inicioQuery);
            if (simInvA >= UMBRAL_CALLE && simInvB >= UMBRAL_CALLE) {
                const promedio = (simInvA + simInvB) / 2;
                const exactitud = Math.min(99, Math.round(95 + promedio * 4));
                return { exactitud };
            }
            return null;
        }

        // ==================================================
        // PREPARACIÓN Y BÚSQUEDA
        // ==================================================
        function prepararDatos(data) {
            const unicos = [];
            const firmasVistas = new Set();

            data.forEach(item => {
                const inicio = item.CALLE_INI || '';
                const fin = item.CALLE_FIN || '';

                item.CRUCES_UNIDOS = `${inicio} - ${fin}`;
                item.CLEAN_MCPO = limpiarTexto(item.NBR_MCPO);
                item.CLEAN_URB = limpiarTexto(item.NBR_URB);
                item.CLEAN_PPAL = limpiarTexto(item.CALLE_PPAL);
                item.CLEAN_CRUCES = limpiarTexto(item.CRUCES_UNIDOS);
                item.CLEAN_COMBO = `${item.CLEAN_MCPO} ${item.CLEAN_URB} ${item.CLEAN_PPAL} ${item.CLEAN_CRUCES}`;
                
                item.CLEAN_INICIO = limpiarTexto(inicio);
                item.CLEAN_FIN = limpiarTexto(fin);

                const firmaDedup = `${item.CLEAN_MCPO} ${item.CLEAN_URB} ${item.CLEAN_PPAL} ${normalizarCruce(inicio, fin)}`;

                if (!firmasVistas.has(firmaDedup)) {
                    firmasVistas.add(firmaDedup);
                    unicos.push(item);
                }
            });

            return unicos;
        }

        let temporizador = null;

        function buscar(origen) {
            if(!fuse) return;
            clearTimeout(temporizador);
            temporizador = setTimeout(() => ejecutarBusqueda(origen), DEBOUNCE_MS);
        }

        function obtenerTextoBusqueda(origen) {
            if (origen === 'rapida') {
                const crudo = dom.rapida.value.replace(/\t/g, ' ');
                const texto = limpiarTexto(crudo);
                const crucesQuery = extraerCruces(crudo);

                dom.mcpo.value = ''; dom.urb.value = ''; dom.ppal.value = '';
                dom.inicio.value = ''; dom.fin.value = '';
                return { texto, crucesQuery };
            }

            const texto = limpiarTexto(`${dom.mcpo.value} ${dom.urb.value} ${dom.ppal.value} ${dom.inicio.value} ${dom.fin.value}`);
            const crucesQuery = {
                inicio: limpiarTexto(dom.inicio.value),
                fin: limpiarTexto(dom.fin.value)
            };

            dom.rapida.value = '';
            return { texto, crucesQuery };
        }

        function clasificarCoincidencia(item, textoBusqueda) {
            if (item.CLEAN_COMBO === textoBusqueda) return 0;
            if (item.CLEAN_COMBO.includes(textoBusqueda)) return 1;
            return null;
        }

        function compararAlfabetico(itemA, itemB) {
            const campos = ['NBR_URB', 'CALLE_INI', 'CALLE_FIN'];
            for (const campo of campos) {
                const valA = (itemA[campo] || '').toString();
                const valB = (itemB[campo] || '').toString();
                const cmp = valA.localeCompare(valB, 'es', { sensitivity: 'base' });
                if (cmp !== 0) return cmp;
            }
            return 0;
        }

        function ordenarPorPrioridad(resultados, textoBusqueda, crucesQuery) {
            return resultados
                .map(res => {
                    const directa = clasificarCoincidencia(res.item, textoBusqueda);
                    if (directa !== null) return { ...res, _prioridad: directa, _exactitudForzada: null };
                    
                    const invertido = evaluarCrucesInvertidos(res.item, crucesQuery);
                    if (invertido) return { ...res, _prioridad: 2, _exactitudForzada: invertido.exactitud };

                    return { ...res, _prioridad: 3, _exactitudForzada: null };
                })
                .sort((a, b) => {
                    if (a._prioridad !== b._prioridad) return a._prioridad - b._prioridad;
                    if (a._prioridad === 2) return b._exactitudForzada - a._exactitudForzada;
                    if (a.score !== b.score) return a.score - b.score;
                    return compararAlfabetico(a.item, b.item);
                });
        }

        function ejecutarBusqueda(origen) {
            const { texto: textoBusqueda, crucesQuery } = obtenerTextoBusqueda(origen);

            if (textoBusqueda === '') {
                dom.resultados.innerHTML = `<tr><td colspan="5"><div class="empty-state">Ingrese parámetros de búsqueda...</div></td></tr>`;
                dom.contador.innerHTML = `DB LISTA [ ${datosUnicos.length} ROWS ]`;
                return;
            }

            let resultados = fuse.search(textoBusqueda);
            resultados = ordenarPorPrioridad(resultados, textoBusqueda, crucesQuery);

            if (resultados.length === 0) {
                dom.contador.innerHTML = '0 MATCHES';
                dom.resultados.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="color:var(--status-error);">0 resultados encontrados para esta búsqueda.</div></td></tr>`;
                return;
            }

            const resultadosMostrar = resultados.slice(0, MAX_RESULTADOS);
            
            let statusQuery = `MATCHES: <span style="color:var(--accent-text);">${resultados.length}</span>`;
            if (resultados.length > MAX_RESULTADOS) statusQuery += ` (LIMIT: ${MAX_RESULTADOS})`;
            dom.contador.innerHTML = statusQuery;
            
            dom.resultados.innerHTML = resultadosMostrar.map(renderResultado).join('');
        }

        function limpiarTodo() {
            dom.rapida.value = '';
            dom.mcpo.value = ''; dom.urb.value = ''; dom.ppal.value = '';
            dom.inicio.value = ''; dom.fin.value = '';
            dom.resultados.innerHTML = `<tr><td colspan="5"><div class="empty-state">Ingrese parámetros de búsqueda...</div></td></tr>`;
            dom.contador.innerHTML = fuse ? `DB LISTA [ ${datosUnicos.length} ROWS ]` : '';
        }

        // ==================================================
        // RENDERIZADO (Estilo Tabla NOC)
        // ==================================================
        function escapeHTML(valor) {
            if (!valor) return '-';
            return String(valor).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function getBadge(exactitud, esInvertido) {
            if (esInvertido) return `<span class="badge badge-rca">CR. INV (${exactitud}%)</span>`;
            if (exactitud > 90) return `<span class="badge badge-success">EXACT (${exactitud}%)</span>`;
            if (exactitud > 70) return `<span class="badge badge-warning">PART (${exactitud}%)</span>`;
            return `<span class="badge badge-error">LOW (${exactitud}%)</span>`;
        }

        function renderResultado(res) {
            const item = res.item;
            const esInvertido = res._prioridad === 2;
            const exactitud = esInvertido ? res._exactitudForzada : Math.round((1 - res.score) * 100);

            return `
            <tr>
                <td>${getBadge(exactitud, esInvertido)}</td>
                <td class="val-mono">${escapeHTML(item.NBR_MCPO)}</td>
                <td>${escapeHTML(item.NBR_URB)}</td>
                <td>${escapeHTML(item.CALLE_PPAL)}</td>
                <td>
                    <span class="cruce-highlight">${escapeHTML(item.CALLE_INI)}</span>
                    <span class="cruce-connector">Y</span>
                    <span class="cruce-highlight">${escapeHTML(item.CALLE_FIN)}</span>
                </td>
            </tr>`;
        }

        // Boot
        window.addEventListener('DOMContentLoaded', inicializarApp);

    </script>
</body>
</html>
