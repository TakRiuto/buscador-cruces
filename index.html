<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cruces Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    <style>
        /* Importamos Outfit como fallback visual de Google Sans */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        body {
            /* Prioriza Google Sans/Product Sans, si no, usa Outfit */
            font-family: 'Google Sans', 'Product Sans', 'Outfit', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #e2e8f0; /* slate-200 */
        }

        /* Scrollbar personalizado para tema oscuro */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; /* slate-800 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; /* slate-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; /* slate-500 */
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 antialiased">

    <div class="max-w-5xl mx-auto bg-slate-800 p-6 md:p-10 rounded-2xl shadow-2xl border border-slate-700/50">
        <h1 class="text-3xl font-bold mb-1 text-white tracking-tight">Validador Geográfico</h1>
        <p class="text-slate-400 text-sm mb-8">Búsqueda y cruce de datos inteligente</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-slate-700/30 p-6 rounded-xl border border-slate-600/50 backdrop-blur-sm transition-colors hover:bg-slate-700/40">
                <h2 class="font-semibold text-lg text-blue-400 mb-2 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Pegado Rápido
                </h2>
                <p class="text-sm text-slate-400 mb-4">Copia la fila (Urb, Ppal, Inicio-Fin) y pégala aquí:</p>
                <textarea id="boxRapida" rows="3" 
                    class="w-full p-4 bg-slate-900/80 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm text-slate-200 placeholder-slate-600 transition-all resize-none shadow-inner" 
                    placeholder="Ej: Los Dos Caminos   Av Sucre   Calle 1 - Calle 2" 
                    oninput="buscar('rapida')"></textarea>
                <div class="flex justify-end mt-3">
                    <button onclick="limpiarTodo()" class="text-sm text-slate-400 hover:text-rose-400 transition-colors font-medium">Limpiar campos</button>
                </div>
            </div>

            <div class="bg-slate-700/30 p-6 rounded-xl border border-slate-600/50 backdrop-blur-sm transition-colors hover:bg-slate-700/40">
                <h2 class="font-semibold text-lg text-slate-200 mb-2 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Búsqueda Manual
                </h2>
                <p class="text-sm text-slate-400 mb-4">Escribe en uno o varios campos:</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <div class="md:col-span-2">
                        <label class="block text-slate-400 text-xs font-semibold mb-1.5 uppercase tracking-wide">Urbanización</label>
                        <input type="text" id="boxUrb" class="w-full p-3 bg-slate-900/80 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-200 transition-all" oninput="buscar('manual')">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs font-semibold mb-1.5 uppercase tracking-wide">Calle Ppal</label>
                        <input type="text" id="boxPpal" class="w-full p-3 bg-slate-900/80 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-200 transition-all" oninput="buscar('manual')">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs font-semibold mb-1.5 uppercase tracking-wide">Cruces</label>
                        <input type="text" id="boxCruces" class="w-full p-3 bg-slate-900/80 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-200 transition-all" placeholder="Inicio - Fin" oninput="buscar('manual')">
                    </div>
                </div>
            </div>
        </div>

        <div id="contador" class="mt-8 font-medium text-slate-300 text-sm"></div>

        <div id="resultados" class="mt-4 space-y-3 max-h-[450px] overflow-y-auto pr-2"></div>
    </div>

    <script src="data.js"></script>

<script>
        function limpiarTexto(texto) {
            if (!texto) return '';
            let t = texto.toUpperCase();
            t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            t = t.replace(/\b(AVENIDA|AV|CALLE|CLL|C|CARRERA|CRA|VEREDA|VD|VDA|PASAJE|PSJ|BLVD|BOULEVARD|AUTOPISTA|AUT|PROLONGACION|PROL|CALLEJON|TRANSVERSAL|TRV)\b\.?/g, '');
            t = t.replace(/[-_,]/g, ' '); 
            t = t.replace(/\s+/g, ' ').trim();
            return t;
        }

        // --- NUEVA LÓGICA DE DEDUPLICACIÓN ---
        const datosUnicos = [];
        const firmasVistas = new Set();

        miData.forEach(item => {
            item.CRUCES_UNIDOS = `${item.CALLE_INICIO} - ${item.CALLE_FIN}`;
            item.CLEAN_URB = limpiarTexto(item.URBANIZACION);
            item.CLEAN_PPAL = limpiarTexto(item.CALLE_PPAL);
            item.CLEAN_CRUCES = limpiarTexto(item.CRUCES_UNIDOS);
            
            // Usamos esto como "Firma única"
            item.CLEAN_COMBO = `${item.CLEAN_URB} ${item.CLEAN_PPAL} ${item.CLEAN_CRUCES}`;

            // Si esta combinación exacta no la hemos visto, la guardamos
            if (!firmasVistas.has(item.CLEAN_COMBO)) {
                firmasVistas.add(item.CLEAN_COMBO);
                datosUnicos.push(item);
            }
        });
        // -------------------------------------

        const opcionesFuzzy = {
            includeScore: true,
            threshold: 0.3,
            ignoreLocation: true,
            keys: [
                { name: 'CLEAN_COMBO', weight: 2.0 }, 
                { name: 'CLEAN_URB', weight: 1.0 },
                { name: 'CLEAN_PPAL', weight: 1.0 },
                { name: 'CLEAN_CRUCES', weight: 1.2 } 
            ]
        };

        // NOTA: Ahora le pasamos 'datosUnicos' a Fuse, NO 'miData' original
        const fuse = new Fuse(datosUnicos, opcionesFuzzy);
        let temporizador;

        function buscar(origen) {
            clearTimeout(temporizador);
            temporizador = setTimeout(() => {
                ejecutarBusqueda(origen);
            }, 250); 
        }

        function ejecutarBusqueda(origen) {
            let textoBusqueda = '';

            if (origen === 'rapida') {
                const textoCrudo = document.getElementById('boxRapida').value;
                textoBusqueda = limpiarTexto(textoCrudo.replace(/\t/g, ' '));
                
                document.getElementById('boxUrb').value = '';
                document.getElementById('boxPpal').value = '';
                document.getElementById('boxCruces').value = '';
            } else {
                const urb = document.getElementById('boxUrb').value;
                const ppal = document.getElementById('boxPpal').value;
                const cruces = document.getElementById('boxCruces').value;
                
                textoBusqueda = limpiarTexto(`${urb} ${ppal} ${cruces}`);
                document.getElementById('boxRapida').value = '';
            }
            
            const cajaResultados = document.getElementById('resultados');
            const cajaContador = document.getElementById('contador');
            
            if(textoBusqueda === '') {
                cajaResultados.innerHTML = '';
                cajaContador.innerHTML = '';
                return;
            }

            const resultados = fuse.search(textoBusqueda);
            let html = '';
            
            if(resultados.length === 0) {
                cajaContador.innerHTML = '';
                html = `<div class="p-5 bg-rose-500/10 text-rose-400 rounded-xl border border-rose-500/20 shadow-sm flex items-center gap-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            No se encontró ninguna coincidencia en la base de datos.
                        </div>`;
            } else {
                const maxResultados = 200; 
                const resultadosMostrar = resultados.slice(0, maxResultados);
                
                let mensajeContador = `Se encontraron <span class="text-white">${resultados.length}</span> coincidencias`;
                if(resultados.length > maxResultados) {
                    mensajeContador += ` <span class="text-slate-500">(Mostrando las ${maxResultados} más relevantes)</span>`;
                }
                cajaContador.innerHTML = mensajeContador;
                
                resultadosMostrar.forEach(res => {
                    const item = res.item;
                    const exactitud = Math.round((1 - res.score) * 100); 
                    
                    let badge = '';
                    if (exactitud > 90) badge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide">Muy Alta (${exactitud}%)</span>`;
                    else if (exactitud > 70) badge = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide">Parcial (${exactitud}%)</span>`;
                    else badge = `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide">Baja (${exactitud}%)</span>`;

                    html += `
                    <div class="p-5 rounded-xl bg-slate-700/40 border border-slate-600/50 hover:bg-slate-700/70 hover:border-slate-500/50 transition-all duration-200 shadow-sm group">
                        <div class="mb-3 flex justify-between items-center">
                            ${badge}
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
                            <div>
                                <span class="block text-[11px] text-slate-500 uppercase tracking-widest font-semibold mb-1">Urbanización</span> 
                                <span class="text-slate-200 group-hover:text-white transition-colors">${item.URBANIZACION || '-'}</span>
                            </div>
                            <div>
                                <span class="block text-[11px] text-slate-500 uppercase tracking-widest font-semibold mb-1">Calle Ppal</span> 
                                <span class="text-slate-200 group-hover:text-white transition-colors">${item.CALLE_PPAL || '-'}</span>
                            </div>
                            <div>
                                <span class="block text-[11px] text-slate-500 uppercase tracking-widest font-semibold mb-1">Cruces</span> 
                                <span class="text-blue-400 font-medium group-hover:text-blue-300 transition-colors">${item.CALLE_INICIO} <span class="text-slate-500 font-normal mx-1">a</span> ${item.CALLE_FIN}</span>
                            </div>
                        </div>
                    </div>
                    `;
                });
            }
            cajaResultados.innerHTML = html;
        }

        function limpiarTodo() {
            document.getElementById('boxRapida').value = '';
            document.getElementById('boxUrb').value = '';
            document.getElementById('boxPpal').value = '';
            document.getElementById('boxCruces').value = '';
            document.getElementById('resultados').innerHTML = '';
            document.getElementById('contador').innerHTML = '';
        }
    </script>
</body>
</html>
